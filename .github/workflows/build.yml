name: Build WQFiles IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Build IPA
        run: ./build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles
          path: WQFiles.ipa
          if-no-files-found: error
